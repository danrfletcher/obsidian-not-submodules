name: Attest release assets

# Generates a signed GitHub artifact-attestation (SLSA build provenance) for
# the plugin's release assets, so users can verify main.js/manifest.json/
# styles.css were actually built from this repository's source, not
# substituted in by hand when the release was published. Runs automatically
# on every future release; workflow_dispatch lets a specific tag (including
# one already published before this workflow existed) be attested
# retroactively - the attestation only depends on rebuilding byte-identical
# assets, not on re-uploading anything to the release itself.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest (defaults to the latest release)"
        required: false

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
